version: '3.8'

services:
  # Optional local MySQL container for developers without an active Aiven Cloud MySQL instance
  db:
    image: mysql:8.0
    container_name: libraflow-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root_dev_password
      MYSQL_DATABASE: libraflow_db
      MYSQL_USER: libraflow_user
      MYSQL_PASSWORD: libraflow_dev_password
    ports:
      - "3306:3306"
    volumes:
      - libraflow-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 10s
      retries: 5

  # LibraFlow Full Stack Web Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: libraflow-app
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: libraflow_db
      DB_USER: libraflow_user
      DB_PASSWORD: libraflow_dev_password
      DB_SSL: "false"
      JWT_SECRET: dev_compose_jwt_secret_change_in_production
      JWT_REFRESH_SECRET: dev_compose_jwt_refresh_secret_change_in_production
    ports:
      - "5000:5000"

volumes:
  libraflow-db-data:
    driver: local
